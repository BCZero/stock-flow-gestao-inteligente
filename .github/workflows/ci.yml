# Integração contínua do StockFlow.
# Roda em todo pull request e em todo push na main. Se algum passo falhar, o check fica vermelho no GitHub.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# O workflow só lê o código; não precisa de permissão de escrita no repositório.
permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior que ainda estiver rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (exatamente as do package-lock.json)
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint

      - name: Build de produção
        run: npm run build

  backend:
    name: Backend (testes de integração)
    runs-on: ubuntu-latest
    # Postgres temporário, criado só para esta execução e descartado no fim.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockflow_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Sem esta variável os testes são pulados (skipUnless em tests/test_estoque.py).
      STOCKFLOW_TEST_DATABASE_URL: postgresql+pg8000://postgres:postgres@localhost:5432/stockflow_teste
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m unittest discover -s tests -v
